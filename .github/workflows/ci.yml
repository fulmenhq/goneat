# yamllint disable rule:document-start
# yamllint disable rule:truthy
# yamllint disable rule:line-length
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  native-contracts:
    uses: ./.github/workflows/native-contracts.yml
  # =============================================================================
  # JOB 1: Build & Test (no external tools required)
  # =============================================================================
  build-test-lint:
    # Use Fulmen-managed runner labels (x64/arm64 variants) instead of GitHub-hosted defaults.
    # This keeps CI consistent across repos and makes architecture selection explicit.
    strategy:
      matrix:
        runner: [ubuntu-latest-x64-s, ubuntu-latest-arm64-s]
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.4
      # glibc runner image includes make/go/rust toolchains for both x64+arm64
      options: --user 1001
    env:
      GOPATH: /tmp/gopath
      GOMODCACHE: /tmp/gopath/pkg/mod
      GOTOOLCHAIN: go1.26.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: make build
      - name: Verify embedded assets in sync
        run: make verify-embeds
      - name: Test
        run: make test
      - name: Prove a required unit-test failure fails make test
        run: bash scripts/test-ci-failure-gate.sh
      - name: golangci-lint (informational)
        continue-on-error: true
        run: |
          go version
          golangci-lint --version
          golangci-lint run ./...
      - name: Upload goneat binary
        uses: actions/upload-artifact@v4.6.2
        with:
          name: goneat-linux-${{ matrix.runner }}
          path: dist/goneat
          retention-days: 1
  # =============================================================================
  # JOB 2: Optional tool-integration diagnostics (not native acceptance)
  # Raw tool checks are blocking; doctor/assessment issues are diagnostic only.
  # Required core acceptance is the separate native-contracts workflow.
  # =============================================================================
  container-probe:
    needs: [build-test-lint]
    # Use Fulmen-managed runner labels (x64/arm64 variants) instead of GitHub-hosted defaults.
    # This keeps CI consistent across repos and makes architecture selection explicit.
    strategy:
      matrix:
        runner: [ubuntu-latest-x64-s, ubuntu-latest-arm64-s]
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.4
      # ghcr.io/fulmenhq/goneat-tools-runner-glibc runs as a non-root user.
      # GitHub mounts runner temp/work directories into the container
      # under /__w.
      # Running as UID 1001 matches the hosted runner's ownership and
      # avoids EACCES
      # when actions (e.g., checkout) write state files under /__w/_temp.
      options: --user 1001
    steps:
      - name: Diagnostics (container mount permissions)
        run: |
          echo "=== Container identity ==="
          id
          whoami || true
          echo "=== Runner-mounted directories ==="
          ls -ld /__w /__w/_temp /__w/_temp/_runner_file_commands || true
          stat -c "%n %U:%G %a" /__w /__w/_temp \
            /__w/_temp/_runner_file_commands || true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download goneat binary
        uses: actions/download-artifact@v4.1.8
        with:
          name: goneat-linux-${{ matrix.runner }}
          path: ./bin
      - name: Verify container tools (raw)
        run: |
          echo "=== Tools in goneat-tools container ==="
          prettier --version
          yamlfmt --version
          jq --version
          yq --version
          rg --version
          ruff --version
          echo "=== All foundation tools present ==="
      - name: Report goneat integration (diagnostic only)
        run: |
          chmod +x ./bin/goneat
          echo "=== goneat doctor tools --scope foundation ==="
          ./bin/goneat doctor tools --scope foundation || true
          echo "=== goneat assess (lint+format) ==="
          ./bin/goneat assess --categories lint,format --fail-on high . || \
            echo "goneat assess reported issues (info)"
  # =============================================================================
  # JOB 3: Bootstrap Probe (HIGHER friction - validates package manager path)
  # Proves: goneat doctor tools --install works on fresh runners
  # Only runs if container-probe passes (don't waste cycles if container fails)
  # =============================================================================
  bootstrap-probe:
    needs: [container-probe]
    # Use Fulmen-managed runner labels (x64/arm64 variants) instead of GitHub-hosted defaults.
    # This keeps CI consistent across repos and makes architecture selection explicit.
    strategy:
      matrix:
        runner: [ubuntu-latest-x64-s, ubuntu-latest-arm64-s]
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.4
      # glibc runner image includes make/go/rust toolchains for both x64+arm64
      options: --user 1001
    env:
      GOPATH: /tmp/gopath
      GOMODCACHE: /tmp/gopath/pkg/mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bootstrap probe (package manager installation)
        env:
          GONEAT_INSTALL_PROBE: "1"
        run: |
          echo "=== Testing package manager tool installation ==="
          echo "Validates higher-friction path for non-container users"
            make install-probe
  # =============================================================================
  # JOB 4: Release tag script tests (gpg required; a skip is a failure)
  # =============================================================================
  release-tag-crypto:
    runs-on: ubuntu-latest-x64-s
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Install gnupg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gnupg
          gpg --version
      - name: Run release-tag tests
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/release-tag-tests.log"
          make test-release-tag | tee "${log}"
          if grep -q -- '--- SKIP' "${log}"; then
            echo "::error::release-tag tests skipped"
            exit 1
          fi
