# yamllint disable rule:document-start
# yamllint disable rule:truthy
# yamllint disable rule:line-length
name: Release binaries
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  candidate-contracts:
    if: ${{ !github.event.repository.private || vars.ALLOW_PRIVATE_RELEASES == 'true' }}
    uses: ./.github/workflows/native-contracts.yml
  build-and-release:
    needs: candidate-contracts
    if: ${{ !github.event.repository.private || vars.ALLOW_PRIVATE_RELEASES == 'true' }}
    environment: public-release
    permissions:
      contents: write
    # Use Fulmen-managed runner labels (x64/arm64 variants) instead of GitHub-hosted defaults.
    # This keeps CI consistent across repos and makes architecture selection explicit.
    runs-on: ubuntu-latest-x64-m
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate VERSION matches tag
        run: |
          VERSION_FILE=$(cat VERSION)
          echo "Git tag:      $GITHUB_REF_NAME"
          echo "VERSION file: $VERSION_FILE"
          if [ "$VERSION_FILE" != "$GITHUB_REF_NAME" ]; then
            echo "❌ VERSION mismatch: file=$VERSION_FILE tag=$GITHUB_REF_NAME"
            echo "   Fix: update VERSION before tagging"
            exit 1
          fi
          echo "✅ VERSION matches tag"
      - name: Download the exact natively accepted candidate bytes
        uses: actions/download-artifact@v4.1.8
        with:
          name: release-candidate
          path: dist/release
      - name: Verify original manifests before publication
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum --check SHA256SUMS
          sha512sum --check SHA512SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/goneat_*.tar.gz
            dist/release/goneat_*.zip
            dist/release/SHA256SUMS
            dist/release/SHA512SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
