# yamllint disable rule:document-start
# yamllint disable rule:truthy
# yamllint disable rule:line-length
name: Release binaries
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  candidate-contracts:
    if: ${{ !github.event.repository.private || vars.ALLOW_PRIVATE_RELEASES == 'true' }}
    uses: ./.github/workflows/native-contracts.yml
  # Read-only: the committed release pins must match their fingerprint anchors
  # under the digest-pinned decernor, and the tag must carry one good signature
  # by the signing subkey pinned in the tagged commit, checked in an isolated
  # keyring (3leaps/crucible PDR-0008 §2.5). A green run is a consistency
  # signal, not release authorization.
  verify-tag:
    if: ${{ !github.event.repository.private || vars.ALLOW_PRIVATE_RELEASES == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest-x64-m
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (tag object and committed pins)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install digest-pinned decernor
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "${RUNNER_TEMP}/decernor.XXXXXX")"
          bin="$(bash scripts/release-fetch-decernor.sh linux_amd64 "${tool_dir}")"
          echo "GONEAT_DECERNOR_BIN=${bin}" >> "${GITHUB_ENV}"
      - name: Verify the tag against the pin committed in the tagged commit
        env:
          TAG: ${{ github.ref_name }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gpg --version
          # Fetch the annotated tag object itself; a lightweight tag has no
          # object to verify and fails here. The tag must name the commit this
          # run builds.
          git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" != "${RUN_SHA}" ]; then
            echo "::error::${TAG} does not point at the commit this run builds (${RUN_SHA})"
            exit 1
          fi
          bash scripts/verify-pinned-tag.sh "${TAG}"
  build-and-release:
    needs: [candidate-contracts, verify-tag]
    if: ${{ !github.event.repository.private || vars.ALLOW_PRIVATE_RELEASES == 'true' }}
    environment: public-release
    permissions:
      contents: write
    # Use Fulmen-managed runner labels (x64/arm64 variants) instead of GitHub-hosted defaults.
    # This keeps CI consistent across repos and makes architecture selection explicit.
    runs-on: ubuntu-latest-x64-m
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate VERSION matches tag
        run: |
          VERSION_FILE=$(cat VERSION)
          echo "Git tag:      $GITHUB_REF_NAME"
          echo "VERSION file: $VERSION_FILE"
          if [ "$VERSION_FILE" != "$GITHUB_REF_NAME" ]; then
            echo "❌ VERSION mismatch: file=$VERSION_FILE tag=$GITHUB_REF_NAME"
            echo "   Fix: update VERSION before tagging"
            exit 1
          fi
          echo "✅ VERSION matches tag"
      - name: Download the exact natively accepted candidate bytes
        uses: actions/download-artifact@v4.1.8
        with:
          name: release-candidate
          path: dist/release
      - name: Verify original manifests before publication
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum --check SHA256SUMS
          sha512sum --check SHA512SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/goneat_*.tar.gz
            dist/release/goneat_*.zip
            dist/release/SHA256SUMS
            dist/release/SHA512SUMS
          generate_release_notes: true
          # Stays a draft until make release-upload has verified and uploaded
          # the signatures; release-assets.py upload publishes it.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
